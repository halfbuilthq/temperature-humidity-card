<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Temperature & Humidity — Customisation preview</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b1117; color: #eef2f7; }
      body { margin: 24px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #a9b1bb; margin: 0 0 20px; }
      main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      @media (max-width: 850px) { main { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 480px) { main { grid-template-columns: minmax(0, 1fr); } }
    </style>
  </head>
  <body>
    <h1>Temperature & Humidity — Customisation</h1>
    <p>Temperature-only gauges, translated warnings and custom comfort colours.</p>
    <main></main>
    <script type="module" src="./customization.ts"></script>
  </body>
</html>
