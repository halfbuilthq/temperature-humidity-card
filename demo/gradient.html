<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Automatic comfort gradients</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b1117; color: #eef2f7; }
      body { margin: 16px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p { color: #a9b1bb; margin: 0 0 8px; font-size: 14px; }
      .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; margin-bottom: 12px; }
      label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
      select, input { font: inherit; }
      output { min-width: 45px; }
      main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      @media (max-width: 850px) { main { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 480px) { main { grid-template-columns: minmax(0, 1fr); } }
    </style>
  </head>
  <body>
    <h1>Automatic comfort gradients</h1>
    <p>Adjust the live card or compare fixed colours. Temperature and humidity blend around the centre of their comfort ranges.</p>
    <div class="controls">
      <label>Mode <select id="mode"><option value="gradient">Automatic gradient</option><option value="state">Fixed colours</option></select></label>
      <label>Live temperature <input id="temperature" type="range" min="10" max="32" step="0.1" value="15" /><output id="temperature-value">15 °C</output></label>
      <label>Live humidity <input id="humidity" type="range" min="20" max="80" step="1" value="50" /><output id="humidity-value">50%</output></label>
    </div>
    <main></main>
    <script type="module" src="./gradient.ts"></script>
  </body>
</html>
